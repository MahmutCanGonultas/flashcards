<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="0.55" stop-color="#7C5CE6"/><stop offset="1" stop-color="#5B3FCB"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9C86F6"/><stop offset="1" stop-color="#5A3FCA"/>
    </linearGradient>
    <linearGradient id="canal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="bgCream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/><stop offset="1" stop-color="#F7EBD6"/>
    </linearGradient>
    <linearGradient id="bgViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  
  <g transform="translate(0 13) scale(1.0)">
    <!-- ears: big, amber-lit, slightly splayed -->
    <g transform="rotate(-22 30 34)">
      <ellipse cx="30" cy="34" rx="15" ry="22" fill="url(#ear)"/>
      <ellipse cx="31" cy="37" rx="8.5" ry="13.5" fill="url(#canal)"/>
      <ellipse cx="31" cy="37" rx="4.5" ry="8" fill="#FDE68A" opacity="0.55"/>
    </g>
    <g transform="rotate(22 70 34)">
      <ellipse cx="70" cy="34" rx="15" ry="22" fill="url(#ear)"/>
      <ellipse cx="69" cy="37" rx="8.5" ry="13.5" fill="url(#canal)"/>
      <ellipse cx="69" cy="37" rx="4.5" ry="8" fill="#FDE68A" opacity="0.55"/>
    </g>
    <!-- head -->
    <circle cx="50" cy="60" r="33" fill="url(#head)"/>
    <ellipse cx="38" cy="44" rx="14" ry="9" fill="#fff" opacity="0.16" transform="rotate(-25 38 44)"/>
    <!-- muzzle -->
    <ellipse cx="50" cy="70" rx="15" ry="10" fill="#F6E9D8"/>
    <!-- eyes -->
    <ellipse cx="38.5" cy="57" rx="8" ry="9.5" fill="#fff"/>
    <ellipse cx="61.5" cy="57" rx="8" ry="9.5" fill="#fff"/>
    <circle cx="40" cy="58.5" r="5.2" fill="#2B1B5E"/>
    <circle cx="63" cy="58.5" r="5.2" fill="#2B1B5E"/>
    <circle cx="38" cy="55.5" r="2" fill="#fff"/>
    <circle cx="61" cy="55.5" r="2" fill="#fff"/>
    <!-- cheeks -->
    <ellipse cx="29" cy="67" rx="5.5" ry="3.2" fill="#F472B6" opacity="0.45"/>
    <ellipse cx="71" cy="67" rx="5.5" ry="3.2" fill="#F472B6" opacity="0.45"/>
    <!-- nose + smile -->
    <ellipse cx="50" cy="66.5" rx="3.2" ry="2.2" fill="#3A1F5C"/>
    <path d="M44.5 72 Q50 77.5 55.5 72" stroke="#3A1F5C" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>